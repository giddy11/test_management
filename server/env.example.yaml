# Cloud Run environment variables.
# Copy to deploy.env.yaml (gitignored), fill in real values, and pass with:
#   gcloud run deploy testmate-api --source . --env-vars-file deploy.env.yaml
#
# For secrets you'd rather not keep in a file, use Secret Manager instead:
#   gcloud run deploy ... --set-secrets DB_PASSWORD=testmate-db-password:latest

NODE_ENV: "production"
# Comma-separated allowlist of your deployed frontend origins.
CORS_ORIGINS: "https://your-frontend.example.com"

# Database (Aiven Postgres — needs SSL)
DB_HOST: "pg-xxxxx.aivencloud.com"
DB_PORT: "25346"
DB_USERNAME: "avnadmin"
DB_PASSWORD: "REPLACE_ME"
DB_NAME: "defaultdb"
DB_SSL: "true"
# Schema is already created; keep synchronize OFF in production and use migrations.
DB_SYNCHRONIZE: "false"

# JWT
JWT_ACCESS_SECRET: "REPLACE_ME"
JWT_REFRESH_SECRET: "REPLACE_ME"
JWT_ACCESS_EXPIRES_IN: "15m"
JWT_REFRESH_EXPIRES_IN: "7d"

# Google Sign In
GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"

# Email — EMAIL_PROVIDER is "nodemailer" (Gmail SMTP) or "script" (Google Apps Script)
EMAIL_PROVIDER: "nodemailer"
EMAIL_USER: "you@gmail.com"
EMAIL_PASSWORD: "your-gmail-app-password"
EMAIL_FROM: "TestMate <you@gmail.com>"
# Only used when EMAIL_PROVIDER is "script". Treat as a secret.
EMAIL_SCRIPT_URL: "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"
OTP_TTL_MINUTES: "15"

# Cloudinary
CLOUDINARY_CLOUD_NAME: "your-cloud-name"
CLOUDINARY_API_KEY: "your-api-key"
CLOUDINARY_API_SECRET: "your-api-secret"
